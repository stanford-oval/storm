<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PaperStorm Agent Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">PaperStorm Agent Dashboard</p>
        <h1>论文调研 Agent 执行链路</h1>
      </div>
      <div class="status-pill" id="project-version">loading</div>
    </header>

    <section class="toolbar" aria-label="service data loader">
      <label>
        Service URL
        <input id="service-url" value="http://127.0.0.1:8000" />
      </label>
      <label>
        Task ID
        <input id="service-task-id" placeholder="输入 task_id" />
      </label>
      <button id="load-service-task" type="button">加载真实任务</button>
      <button id="load-sample-data" type="button">加载样例数据</button>
      <span id="data-source-status">sample data</span>
    </section>

    <main class="dashboard-grid">
      <section class="panel wide" id="create-task-panel">
        <h2>任务控制台</h2>
        <div class="control-grid">
          <label>
            Topic
            <input id="task-topic" value="pim 神经网络抑制" />
          </label>
          <label>
            Run Mode
            <select id="task-run-mode">
              <option value="fake">fake</option>
              <option value="paperstorm">paperstorm</option>
            </select>
          </label>
          <label>
            Retriever
            <select id="task-retriever">
              <option value="arxiv">arxiv</option>
              <option value="local-pdf">local-pdf</option>
            </select>
          </label>
          <label>
            Output Language
            <select id="task-output-language">
              <option value="zh">zh</option>
              <option value="original">original</option>
            </select>
          </label>
          <label>
            Expected Keyword
            <input id="task-expected-keyword" value="passive intermodulation" />
          </label>
          <label>
            Forbidden Keyword
            <input id="task-forbidden-keyword" value="DRAM" />
          </label>
          <div class="button-row">
            <button id="submit-task" type="button">提交任务</button>
            <button id="run-selected-task" type="button">运行选中任务</button>
            <button id="poll-selected-task" type="button">轮询选中任务</button>
            <button id="refresh-task-list" type="button">刷新任务列表</button>
          </div>
        </div>
      </section>

      <section class="panel" id="task-panel">
        <h2>任务状态</h2>
        <div id="task-list" class="stack"></div>
      </section>

      <section class="panel" id="task-error-panel">
        <h2>失败信息</h2>
        <div id="task-error" class="stack"></div>
      </section>

      <section class="panel" id="scorecard-panel">
        <h2>评估分数</h2>
        <div id="scorecard" class="metric-grid"></div>
      </section>

      <section class="panel wide" id="article-panel">
        <h2>调研文章</h2>
        <article id="article-content" class="article"></article>
      </section>

      <section class="panel" id="qa-panel">
        <h2>知识库问答</h2>
        <div id="qa-answer" class="stack"></div>
      </section>

      <section class="panel" id="trace-panel">
        <h2>Runtime Trace</h2>
        <ol id="trace-list" class="timeline"></ol>
      </section>

      <section class="panel wide" id="multi-agent-panel">
        <h2>Multi-Agent 编排</h2>
        <div id="multi-agent" class="stack"></div>
      </section>

      <section class="panel" id="pipeline-worker-panel">
        <h2>Pipeline Worker</h2>
        <div id="pipeline-worker" class="metric-grid"></div>
      </section>

      <section class="panel wide" id="stress-panel">
        <h2>稳定性压测</h2>
        <div id="stress-report" class="metric-grid"></div>
      </section>
    </main>

    <script src="sample_data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
